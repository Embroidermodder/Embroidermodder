name: Build

on:
  schedule:
    - cron: '10 6 * * *'
  push:
    branches:
      - 'current'
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'current'
      - name: Build
        run: bash bin/build.sh "Ubuntu"
      - uses: actions/upload-artifact@v7
        with:
          path: build

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'current'
      - name: Build
        run: bash bin/build.sh "MacOS"
      - uses: actions/upload-artifact@v7
        with:
          path: build

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'current'
      - name: Build
        run: bash bin/build.sh "Windows"
      - uses: actions/upload-artifact@v7
        with:
          path: build
